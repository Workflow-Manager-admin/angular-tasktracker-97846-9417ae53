<mat-toolbar color="primary">
  <span>Task Tracker</span>
</mat-toolbar>

<main style="display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem;">
  <section style="width:100%;max-width:480px;">
    <app-task-form (taskCreated)="onTaskCreated($event)"></app-task-form>
    <div style="margin-top:2rem">
      <app-task-list [tasks]="tasks$ | async"
        (toggleComplete)="onToggleComplete($event)"
        (delete)="onDelete($event)">
      </app-task-list>
    </div>
  </section>
</main>
